name: Release distro packages

on:
  release:
    types:
      - published

  # Use the manual trigger when the workflow or related scripts had to be
  # updated post-release to successfully publish.
  workflow_dispatch:
    inputs:
      version:
        description: Version to (re-)publish, e.g., v2.0.0
        required: true
        type: string

env:
  # Pick the right version input based on the workflow trigger.
  VERSION: ${{ case(github.event_name == 'release', github.ref_name, inputs.version) }}

permissions:
  contents: read

jobs:
  deb:
    name: Release DEBs
    runs-on: ubuntu-latest
    if: github.event_name != 'release' || !contains(github.ref_name, 'nightly')
    env:
      BUCKET: ${{ secrets.PKG_S3_BUCKET_NAME }}
      AWS_ENDPOINT_URL: "https://${{ secrets.PKG_S3_SERVER_NAME }}"
      AWS_REGION: ${{ secrets.PKG_S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PKG_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PKG_S3_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Import GPG key
        id: gpg-import
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSWORD }}

      # This installs reprepro from source to pin it to a version that we know
      # works given our constraints:
      #
      # - Versions lower than 5.4.0 don't support "Limit: 0"
      # - Version 5.5.1 (latest as of writing this comment) creates bad gzip
      #   outputs (See https://github.com/openbao/openbao/issues/3799)
      #
      # Debian/Ubuntu only distribute versions within 5.3.x and 5.5.x across
      # stable and unstable repos at this time, and this is the quickest exit
      # out of dependency hell.
      - name: Install reprepro
        env:
          REPREPRO_VERSION: 5.4.8
          REPREPRO_SHA256: 4a55ecabb962d11aa32553606b2ff4449dad6c673e4cd0e0741cd8b992a1b1a3
        run: |
          cd "$(mktemp -d)"
          sudo apt install -y libarchive-dev libgpgme-dev libdb-dev
          SOURCE="reprepro-reprepro-${REPREPRO_VERSION}"
          ARCHIVE="${SOURCE}.tar.gz"
          curl -LO \
            "https://salsa.debian.org/debian/reprepro/-/archive/reprepro-${REPREPRO_VERSION}/${ARCHIVE}" \
            && sha256sum -c - <<< "${REPREPRO_SHA256}  ${ARCHIVE}" \
            && tar xvf "$ARCHIVE" && cd "$SOURCE"
          ./autogen.sh
          ./configure
          make -j$(nproc)
          sudo make install

      - name: Download db and dists
        run: |
          aws s3 sync "s3://${BUCKET}/deb/db" build/deb/db
          aws s3 sync "s3://${BUCKET}/deb/dists" build/deb/dists

      - name: Download packages from release
        run: ./scripts/release/download-artifacts.sh
        env:
          PATTERN: '*.deb'
          GITHUB_TOKEN: ${{ github.token }}

      - name: Update repository
        run: ./scripts/release/update-deb-repo.sh
        env:
          GPG_FINGERPRINT: ${{ steps.gpg-import.outputs.fingerprint }}

      - name: Upload repository
        run: aws s3 sync build/deb "s3://${BUCKET}/deb"
    
  rpm:
    name: Release RPMs
    runs-on: ubuntu-latest
    # Skip if triggered by a nightly release being published.
    if: github.event_name != 'release' || !contains(github.ref_name, 'nightly')
    env:
      BUCKET: ${{ secrets.PKG_S3_BUCKET_NAME }}
      AWS_ENDPOINT_URL: "https://${{ secrets.PKG_S3_SERVER_NAME }}"
      AWS_REGION: ${{ secrets.PKG_S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PKG_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PKG_S3_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install rpm & createrepo_c
        run: sudo apt install -y rpm createrepo-c

      - name: Determine repository
        run: |
          case "$VERSION" in
            *-*) echo REPO=rpm-testing ;;
            *)   echo REPO=rpm ;;
          esac > "$GITHUB_ENV"

      - name: Download repodata
        run: aws s3 sync "s3://${BUCKET}/${REPO}" build/rpm --exclude \*.rpm

      - name: Download packages from release
        run: ./scripts/release/download-artifacts.sh
        env:
          PATTERN: '*.rpm'
          GITHUB_TOKEN: ${{ github.token }}

      - name: Update repository
        run: ./scripts/release/update-rpm-repo.sh

      - name: Upload repository
        run: aws s3 sync build/rpm "s3://${BUCKET}/${REPO}"
