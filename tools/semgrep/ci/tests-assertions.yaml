rules:
  - id: use-testify-for-error-checks
    
    metadata: 
      category: best-practice
    languages:
     - go
    severity: ERROR
    message: "use github.com/stretchr/testify for test assertions"

    patterns:
      - pattern: 'if $ERR != nil { $T.Fatal(err) }'

    fix: require.NoError($T, $ERR)
