syntax = "proto3";
package join;

option go_package = "github.com/openbao/openbao/sdk/v2/plugin/join/pb";

import "google/protobuf/struct.proto";

message Empty {}

message CandidatesArgs {
    google.protobuf.Struct config = 1;
}

message JoinCandidate {
    string host = 1;
    string scheme = 2;
    uint32 port = 3;
}

message JoinCandidates {
    repeated JoinCandidate candidates = 1;
}

service Join {
    rpc Candidates(CandidatesArgs) returns (JoinCandidates);
    rpc Cleanup(Empty) returns (Empty);
}
