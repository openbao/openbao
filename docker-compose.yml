services:
  openbao:
    image: openbao/openbao:latest
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    command:
      - server
      - -config=/openbao/config/config.hcl
    volumes:
      - openbao-data:/openbao/file
      - ./deploy/config.hcl:/openbao/config/config.hcl:ro
    environment:
      - BAO_REDIRECT_ADDR=https://${DOMAIN:-vault.yourdomain.com}
    expose:
      - "8200"
    # Agar direct server port access chahiye to niche un-comment karein:
    # ports:
    #   - "8200:8200"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  openbao-data:

